<script>
const DATA = JSON.parse(document.getElementById("oem-data").textContent);
const CHECK_KEY = "oem-earnings-checks-v1";
const NOTE_KEY = "oem-earnings-notes-v1";
const TABS = ["calendar", "official", "pdf", "transcript", "video", "watch"];
const BUCKET_LABEL = { official: "官方链接", pdf: "财报 PDF", transcript: "文字记录", video: "视频" };

const state = {
  tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "calendar",
  q: "",
  region: "全部",
  dated: false,
  guided: false
};

function loadMap(key) {
  try { return JSON.parse(localStorage.getItem(key) || "{}"); }
  catch (e) { return {}; }
}
let checks = loadMap(CHECK_KEY);
let notes = loadMap(NOTE_KEY);

function persist() {
  localStorage.setItem(CHECK_KEY, JSON.stringify(checks));
  localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    if (k === "text") node.textContent = attrs[k];
    else if (k === "html") node.innerHTML = attrs[k];
    else if (k === "hidden") node.hidden = attrs[k];
    else node.setAttribute(k, attrs[k]);
  });
  for (let i = 2; i < arguments.length; i++) {
    const child = arguments[i];
    if (child == null) continue;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function companies() {
  return DATA.companies.filter(function (c) {
    if (state.region !== "全部" && c.region !== state.region) return false;
    if (state.dated && !c.nextDate) return false;
    if (state.tab === "watch" && state.guided && !c.guidance) return false;
    if (state.q) {
      const hay = [c.name, c.en, c.tickers, c.region, c.headline || "", c.nextPeriod || ""].join(" ").toLowerCase();
      if (hay.indexOf(state.q.trim().toLowerCase()) < 0) return false;
    }
    return true;
  });
}

function byOrder(a, b) { return a.order - b.order; }

function linkList(items) {
  const ul = el("ul", { class: "links" });
  items.forEach(function (item) {
    const li = el("li");
    li.appendChild(el("a", { href: item.url, target: "_blank", rel: "noopener noreferrer", text: item.label }));
    if (item.note) li.appendChild(el("div", { class: "small", text: item.note }));
    ul.appendChild(li);
  });
  return ul;
}

function cardHead(c) {
  const head = el("div");
  head.appendChild(el("h2", {}, c.name + " ", el("span", { text: c.en })));
  const when = c.nextDate ? c.nextWhen : "未公布";
  head.appendChild(el("p", { class: "meta", text: c.tickers + " · " + c.region + " · 财年" + c.fy + " · 下次 " + when }));
  return head;
}

function renderCalendar(list) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "note" },
    el("p", { text: "窗口 2026-10-18 至 2027-01-16。同一天按来源页面给出的顺序排列。没有公司或交易所依据的日期不在这张表里。" })
  ));
  const dated = list.filter(function (c) { return c.nextDate && c.order < 100; }).sort(byOrder);
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  ["日期与时间", "公司", "代码", "市场", "期间", "日期来源"].forEach(function (h) {
    hr.appendChild(el("th", { text: h }));
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  const tb = el("tbody");
  dated.forEach(function (c) {
    const tr = el("tr");
    tr.appendChild(el("td", { text: c.nextWhen }));
    tr.appendChild(el("td", { text: c.name }));
    tr.appendChild(el("td", { text: c.tickers }));
    tr.appendChild(el("td", { text: c.region }));
    const period = el("td", { text: c.nextPeriod });
    if (c.nextNote) period.appendChild(el("div", { class: "small", text: c.nextNote }));
    tr.appendChild(period);
    const src = el("td");
    (c.dateSources || []).forEach(function (s, i) {
      if (i) src.appendChild(document.createTextNode(" "));
      src.appendChild(el("a", { href: s.url, target: "_blank", rel: "noopener noreferrer", text: s.label }));
    });
    tr.appendChild(src);
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  const scroller = el("div", { class: "scroll" });
  scroller.appendChild(table);
  wrap.appendChild(scroller);

  const undated = list.filter(function (c) { return !c.nextDate; }).sort(byOrder);
  wrap.appendChild(el("h3", { class: "sec", text: "下次日期未公布（" + undated.length + "）" }));
  if (!undated.length) {
    wrap.appendChild(el("p", { class: "empty", text: "当前筛选下没有未公布日期的公司。" }));
  }
  undated.forEach(function (c) {
    const card = el("article", { class: "card", "data-id": c.id });
    card.appendChild(cardHead(c));
    card.appendChild(el("p", { text: c.undatedWhy || "公司 IR 或交易所预约里没有下一场日期。" }));
    if ((c.dateSources || []).length) card.appendChild(linkList(c.dateSources));
    wrap.appendChild(card);
  });
  return wrap;
}

function renderBucket(list, bucket) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "note" },
    el("p", { text: "这一栏只放公司、交易所或监管归档上的" + BUCKET_LABEL[bucket] + "。新闻转载、行情站和电话会代录不放进来。" })
  ));
  const have = [];
  const miss = [];
  list.slice().sort(byOrder).forEach(function (c) {
    const items = (c.materials || []).filter(function (m) { return m.bucket === bucket; });
    if (items.length) have.push({ c: c, items: items });
    else miss.push(c);
  });
  wrap.appendChild(el("p", { class: "small", text: "有链接 " + have.length + " 家，这一栏为空 " + miss.length + " 家。" }));
  have.forEach(function (row) {
    const card = el("article", { class: "card", "data-id": row.c.id });
    card.appendChild(cardHead(row.c));
    card.appendChild(linkList(row.items));
    wrap.appendChild(card);
  });
  wrap.appendChild(el("h3", { class: "sec", text: "这一栏没有可引用链接" }));
  miss.forEach(function (c) {
    const card = el("article", { class: "card", "data-id": c.id });
    card.appendChild(cardHead(c));
    const reason = (c.gaps && c.gaps[bucket]) || "检索日没有打开到公司托管的该类原文。";
    card.appendChild(el("div", { class: "gap", text: reason }));
    wrap.appendChild(card);
  });
  return wrap;
}

function watchProgress(c) {
  const total = (c.watches || []).length;
  let done = 0;
  for (let i = 0; i < total; i++) if (checks[c.id + "-" + i]) done++;
  return { done: done, total: total };
}

function renderWatch(list) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "note" },
    el("p", { text: "半年窗口收到 2027-04-18。每家只列已经公布的下一场；没公布的写未公布，不估日期。" }),
    el("p", { text: "核对项来自上一份已打开的公司或交易所原文，用来在下一场财报里对照。勾选和笔记只存在这台浏览器里。" })
  ));
  const rows = list.slice().sort(byOrder);
  let doneN = 0;
  let totalN = 0;
  rows.forEach(function (c) {
    const p = watchProgress(c);
    doneN += p.done;
    totalN += p.total;
  });
  wrap.appendChild(el("p", { class: "small", id: "watch-count", text: "当前筛选已勾选 " + doneN + " / " + totalN }));
  rows.forEach(function (c) {
    const card = el("article", { class: "card", "data-id": c.id });
    const p = watchProgress(c);
    const head = cardHead(c);
    const st = el("span", { class: "status" + (p.total && p.done === p.total ? " done" : p.done ? " part" : ""), text: p.total ? (p.done + "/" + p.total + " 已核对") : "无核对项" });
    head.querySelector("h2").appendChild(document.createTextNode(" "));
    head.querySelector("h2").appendChild(st);
    card.appendChild(head);
    card.appendChild(el("p", {}, el("span", { class: "k", text: "下一场 " }), c.nextDate ? (c.nextWhen + "，" + c.nextPeriod) : "未公布"));
    if (c.nextNote) card.appendChild(el("p", { class: "small", text: c.nextNote }));
    (c.later || []).forEach(function (item) {
      card.appendChild(el("p", { class: "small", text: "公司还预告了 " + item.when + " " + item.period + "。" + item.note }));
    });
    if (c.headline) card.appendChild(el("p", {}, el("span", { class: "k", text: "最近一期 " }), c.headline));
    if (c.change) card.appendChild(el("p", {}, el("span", { class: "k", text: "原文里的变化 " }), c.change));
    if (c.figureGap) card.appendChild(el("div", { class: "gap", text: c.figureGap }));
    if (c.guidance) card.appendChild(el("div", { class: "guide", text: "公司已陈述：" + c.guidance }));
    else card.appendChild(el("p", { class: "small", text: "已打开的材料里没有另摘一条可引用的数字指引。上调或重申如果只有定性说法，写在核对项里，这里不补数字。" }));
    const ul = el("ul", { class: "watch" });
    (c.watches || []).forEach(function (text, i) {
      const id = c.id + "-" + i;
      const box = el("input", { type: "checkbox", id: "w-" + id });
      box.checked = !!checks[id];
      box.addEventListener("change", function () {
        checks[id] = box.checked;
        persist();
        render();
      });
      const li = el("li");
      li.appendChild(box);
      li.appendChild(el("label", { for: "w-" + id, text: text }));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    const lab = el("label", { class: "small", text: "发布后笔记（只存在本机）" });
    const area = el("textarea", { "aria-label": c.name + "发布后笔记" });
    area.value = notes[c.id] || "";
    area.addEventListener("input", function () {
      notes[c.id] = area.value;
      persist();
    });
    lab.appendChild(area);
    card.appendChild(lab);
    wrap.appendChild(card);
  });
  return wrap;
}

function render() {
  document.getElementById("guided-wrap").hidden = state.tab !== "watch";
  document.querySelectorAll("#tabs button").forEach(function (btn) {
    btn.setAttribute("aria-selected", btn.getAttribute("data-tab") === state.tab ? "true" : "false");
  });
  const list = companies();
  const app = document.getElementById("app");
  app.textContent = "";
  let view;
  if (state.tab === "calendar") view = renderCalendar(list);
  else if (state.tab === "watch") view = renderWatch(list);
  else view = renderBucket(list, state.tab);
  app.appendChild(view);
  if (location.hash.slice(1) !== state.tab) history.replaceState(null, "", "#" + state.tab);
}

function initCounts() {
  const box = document.getElementById("counts");
  const all = DATA.companies;
  const dated = all.filter(function (c) { return !!c.nextDate; }).length;
  box.appendChild(el("span", { class: "pill" }, "检索日 ", el("strong", { text: DATA.asOf })));
  box.appendChild(el("span", { class: "pill" }, "名录 ", el("strong", { text: String(all.length) }), " 家"));
  box.appendChild(el("span", { class: "pill" }, "已核对下次日期 ", el("strong", { text: String(dated) }), " 家"));
  box.appendChild(el("span", { class: "pill" }, "未公布 ", el("strong", { text: String(all.length - dated) }), " 家"));
  ["official", "pdf", "transcript", "video"].forEach(function (bucket) {
    const n = all.filter(function (c) {
      return (c.materials || []).some(function (m) { return m.bucket === bucket; });
    }).length;
    box.appendChild(el("span", { class: "pill" }, BUCKET_LABEL[bucket] + " ", el("strong", { text: String(n) }), " 家"));
  });
}

function initRegion() {
  const sel = document.getElementById("region");
  const regions = ["全部"];
  DATA.companies.forEach(function (c) {
    if (regions.indexOf(c.region) < 0) regions.push(c.region);
  });
  regions.forEach(function (r) {
    sel.appendChild(el("option", { value: r, text: r }));
  });
  sel.addEventListener("change", function () { state.region = sel.value; render(); });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  document.getElementById("dated").addEventListener("change", function (e) { state.dated = e.target.checked; render(); });
  document.getElementById("guided").addEventListener("change", function (e) { state.guided = e.target.checked; render(); });
  document.getElementById("tabs").addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn) return;
    state.tab = btn.getAttribute("data-tab");
    render();
  });
  document.getElementById("clear-local").addEventListener("click", function () {
    if (!confirm("清除这台浏览器里的勾选和笔记？")) return;
    checks = {};
    notes = {};
    persist();
    render();
  });
  window.addEventListener("hashchange", function () {
    const next = location.hash.slice(1);
    if (TABS.indexOf(next) >= 0 && next !== state.tab) {
      state.tab = next;
      render();
    }
  });
}

initCounts();
initRegion();
render();
</script>
</body>
</html>
